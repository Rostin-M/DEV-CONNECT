name: dev_connect
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_app_check: ^0.4.1+2
  firebase_messaging: ^16.0.4

  provider: ^6.1.2
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.1.0
  http: ^1.1.0

  cloudinary_public: ^0.23.0

  flutter_dotenv: ^5.1.0

  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  image_picker: ^1.0.4
  url_launcher: ^6.3.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - .env
